<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#d6e8f7">
<meta name="color-scheme" content="light only">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="유패밀리 오사카">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%B8%3C/text%3E%3C/svg%3E">
<title>가족 앨범 · 유 패밀리 오사카</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  :root{
    --sky:#d6e8f7; --peach:#fbdcd5; --peach-ink:#b0574d;
    --blue:#6b9cc8; --blue-dark:#46698c; --blue-soft:#eef5fc;
    --coral-soft:#fdf1ef; --ok:#3fa575; --ok-soft:#e5f5ec;
    --butter:#fff6dc; --butter-ink:#8a6d1f;
    --ink:#34414b; --muted:#7d8a93; --line:#e8edf1; --bg:#fbf8f5; --card:#fff;
    --shadow:0 4px 18px rgba(107,156,200,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{color-scheme:light;-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    background:var(--bg);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(30px + env(safe-area-inset-bottom))}
  button,a,input,select{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  input,select{font-size:16px !important}
  select{-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,#7d8a93 50%),linear-gradient(135deg,#7d8a93 50%,transparent 50%);
    background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:28px !important}

  .top{position:sticky;top:0;z-index:5;background:var(--sky);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 12px rgba(107,156,200,.18)}
  .back{background:#fff;color:var(--blue-dark);text-decoration:none;font-weight:700;font-size:.85rem;padding:7px 12px;border-radius:999px;white-space:nowrap}
  .top h1{font-size:1.05rem;font-weight:900;color:var(--blue-dark)}
  .sync{border:none;background:#fff;color:var(--blue-dark);font:inherit;font-size:.8rem;font-weight:700;padding:7px 10px;border-radius:999px;cursor:pointer;white-space:nowrap}
  main{max-width:720px;margin:0 auto;padding:16px}

  .mode{font-size:.8rem;border-radius:12px;padding:10px 14px;margin-bottom:12px;line-height:1.6}
  .mode.cloud{background:var(--ok-soft);color:var(--ok)}
  .mode.off{background:var(--butter);color:var(--butter-ink)}

  .up{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px}
  .up h2{font-size:.95rem;font-weight:900;color:var(--blue-dark);margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .up label{display:block;font-size:.74rem;color:var(--muted);font-weight:700;margin-bottom:3px}
  .up select,.up input[type=text]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;background:#fff;color:var(--ink)}
  .pick{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:12px;border:none;background:var(--ok);color:#fff;
    font:inherit;font-size:1rem;font-weight:900;padding:14px;border-radius:14px;cursor:pointer}
  .pick:disabled{opacity:.6}
  .prog{margin-top:10px;font-size:.82rem;color:var(--blue-dark);font-weight:700;display:none}
  .prog.on{display:block}
  .bar{height:8px;background:var(--blue-soft);border-radius:999px;overflow:hidden;margin-top:6px}
  .bar i{display:block;height:100%;width:0;background:var(--blue);transition:width .2s}

  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:16px 0 4px;padding-bottom:2px}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex-shrink:0;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:.82rem;font-weight:700;color:var(--ink);padding:6px 14px;border-radius:999px;cursor:pointer}
  .chip.on{background:var(--peach);border-color:var(--peach);color:var(--peach-ink)}

  .day-head{display:flex;justify-content:space-between;align-items:baseline;margin:18px 4px 8px}
  .day-head b{color:var(--blue-dark)}
  .day-head span{font-size:.8rem;color:var(--muted)}
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  @media(min-width:600px){.gal{grid-template-columns:repeat(4,1fr)}}
  .ph{position:relative;aspect-ratio:1;background:var(--blue-soft);border-radius:8px;overflow:hidden;cursor:zoom-in}
  .ph img{width:100%;height:100%;object-fit:cover;display:block}
  .ph .who{position:absolute;left:4px;bottom:4px;background:rgba(255,255,255,.85);font-size:.66rem;font-weight:700;color:var(--ink);padding:1px 6px;border-radius:999px}
  .empty{text-align:center;color:var(--muted);font-size:.88rem;padding:36px 10px}

  /* 라이트박스 + 핀치 확대 */
  .lb{position:fixed;inset:0;z-index:50;background:#0d1418;display:none;flex-direction:column;overscroll-behavior:contain}
  .lb.on{display:flex}
  .lb-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;color:#fff}
  .lb-top span{font-size:.85rem;opacity:.85}
  .lb-btn{border:none;background:#fff;color:var(--ink);font:inherit;font-size:.85rem;font-weight:900;padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
  .lb-btn.ghost{background:rgba(255,255,255,.16);color:#fff}
  .stage{flex:1;position:relative;overflow:hidden;touch-action:none}
  .stage img{position:absolute;left:50%;top:50%;max-width:100%;max-height:100%;transform-origin:center center;
    transform:translate(-50%,-50%);user-select:none;-webkit-user-drag:none;will-change:transform}
  .nav{position:absolute;top:50%;transform:translateY(-50%);z-index:2;width:46px;height:46px;border-radius:50%;border:none;
    background:rgba(255,255,255,.9);font-size:1.8rem;line-height:1;color:var(--ink);cursor:pointer;padding-bottom:4px}
  .nav.prev{left:10px} .nav.next{right:10px}
  .nav[hidden]{display:none}
  .lb-bot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:10px 12px calc(14px + env(safe-area-inset-bottom));color:#fff;font-size:.8rem}
  .hint{width:100%;text-align:center;opacity:.6}
  .toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;pointer-events:none;transition:.25s;z-index:60}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header class="top">
  <a class="back" href="index.html">← 여행 페이지</a>
  <h1>📸 가족 앨범</h1>
  <button class="sync" id="sync">🔄</button>
</header>

<main>
  <div class="mode" id="mode"></div>

  <section class="up">
    <h2>📤 사진 올리기</h2>
    <div class="grid2">
      <div><label>날짜</label><select id="fDay"></select></div>
      <div><label>올리는 사람</label><select id="fWho"></select></div>
    </div>
    <input id="file" type="file" accept="image/*" multiple hidden>
    <button class="pick" id="pick">📷 사진 고르기 (여러 장 가능)</button>
    <div class="prog" id="prog"><span id="progTxt"></span><div class="bar"><i id="progBar"></i></div></div>
  </section>

  <div class="chips" id="chips"></div>
  <div id="list"></div>
</main>

<div class="lb" id="lb">
  <div class="lb-top"><span id="lbInfo"></span><button class="lb-btn" id="lbX">✕ 나가기</button></div>
  <div class="stage" id="stage">
    <button class="nav prev" id="prev">‹</button>
    <img id="lbImg" alt="">
    <button class="nav next" id="next">›</button>
  </div>
  <div class="lb-bot">
    <a class="lb-btn ghost" id="lbSave" target="_blank" rel="noopener">⬇️ 원본 보기·저장</a>
    <button class="lb-btn ghost" id="lbDel">🗑️ 삭제</button>
    <div class="hint">두 손가락으로 확대 · 두 번 톡 확대/축소 · 옆으로 밀어서 넘기기</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const CFG = window.OSAKA_CONFIG || {};
const BUCKET = "osaka-album";
const TABLE = "osaka_photos";
const DAYS = [
  { date:"2026-12-28", label:"12/28(월)" },
  { date:"2026-12-29", label:"12/29(화)" },
  { date:"2026-12-30", label:"12/30(수)" },
  { date:"2026-12-31", label:"12/31(목)" }
];
const WHO = ["아빠","엄마","나","동생"];
const MAX_SIDE = 1600;     // 업로드 전에 긴 쪽 1600px로 줄여요 (데이터·저장공간 절약)

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m){ const t=$("#toast"); t.textContent=m; t.classList.add("on"); setTimeout(()=>t.classList.remove("on"),1800); }

let sb=null;
if(CFG.SUPABASE_KEY && window.supabase){ try{ sb=window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_KEY); }catch(e){ sb=null; } }
const pubUrl = path => sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl;

let photos=[], filter="all";

function setup(){
  $("#mode").className="mode "+(sb?"cloud":"off");
  $("#mode").innerHTML = sb ? "☁️ 가족 공유 앨범이에요. 누가 올려도 모두에게 보여요."
    : "⚠️ 아직 Supabase가 연결되지 않았어요.<br>config.js에 anon public 키를 넣으면 사진을 올릴 수 있어요.";
  $("#pick").disabled=!sb;
  const n=new Date(), t=`${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,"0")}-${String(n.getDate()).padStart(2,"0")}`;
  $("#fDay").innerHTML=DAYS.map(d=>`<option value="${d.date}">${d.label}</option>`).join("");
  $("#fDay").value = DAYS.some(d=>d.date===t) ? t : DAYS[0].date;
  $("#fWho").innerHTML=WHO.map(w=>`<option>${w}</option>`).join("");
  try{ const w=localStorage.getItem("yoo-osaka-who"); if(w) $("#fWho").value=w; }catch(e){}
}

async function load(show){
  if(!sb){ render(); return; }
  try{
    const { data, error } = await sb.from(TABLE).select("*").order("created_at",{ascending:true});
    if(error) throw error;
    photos = data.map(p=>({ ...p, url: pubUrl(p.path) }));
    render(); if(show) toast("최신 사진을 불러왔어요");
  }catch(e){ console.error(e); toast("불러오기 실패 · 인터넷 연결을 확인해 주세요"); }
}

function view(){ return photos.filter(p=>filter==="all"||p.day===filter); }
function render(){
  $("#chips").innerHTML=[`<button class="chip ${filter==="all"?"on":""}" data-d="all">전체 ${photos.length}</button>`]
    .concat(DAYS.map(d=>{ const n=photos.filter(p=>p.day===d.date).length; return `<button class="chip ${filter===d.date?"on":""}" data-d="${d.date}">${d.label}${n?` ${n}`:""}</button>`; })).join("");
  const v=view();
  if(!v.length){ $("#list").innerHTML=`<div class="empty">${sb?"아직 사진이 없어요.<br>위에서 첫 사진을 올려 보세요 📷":"Supabase를 연결하면 여기에 사진이 모여요 📷"}</div>`; return; }
  $("#list").innerHTML=DAYS.filter(d=>filter==="all"||filter===d.date).map(d=>{
    const list=v.filter(p=>p.day===d.date); if(!list.length) return "";
    return `<div class="day-head"><b>${d.label}</b><span>${list.length}장</span></div>
      <div class="gal">${list.map(p=>`<div class="ph" data-id="${esc(p.id)}"><img src="${esc(p.url)}" alt="" loading="lazy" decoding="async"><span class="who">${esc(p.uploader||"")}</span></div>`).join("")}</div>`;
  }).join("");
}

/* ── 업로드 (폰에서 바로 줄여서 올리기) ── */
async function shrink(file){
  try{
    let src;
    try{ src = await createImageBitmap(file,{ imageOrientation:"from-image" }); }
    catch(e){ src = await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=URL.createObjectURL(file); }); }
    const w=src.width, h=src.height, r=Math.min(1, MAX_SIDE/Math.max(w,h));
    const c=document.createElement("canvas"); c.width=Math.round(w*r); c.height=Math.round(h*r);
    c.getContext("2d").drawImage(src,0,0,c.width,c.height);
    const blob = await new Promise(res=>c.toBlob(res,"image/jpeg",0.85));
    if(blob) return blob;
  }catch(e){ console.warn("resize failed, uploading original", e); }
  return file;
}
$("#pick").addEventListener("click",()=>$("#file").click());
$("#fWho").addEventListener("change",e=>{ try{ localStorage.setItem("yoo-osaka-who",e.target.value); }catch(err){} });
$("#file").addEventListener("change", async e=>{
  const files=[...e.target.files]; e.target.value="";
  if(!files.length||!sb) return;
  const day=$("#fDay").value, who=$("#fWho").value;
  $("#pick").disabled=true; $("#prog").classList.add("on");
  let ok=0;
  for(let i=0;i<files.length;i++){
    $("#progTxt").textContent=`올리는 중… ${i+1} / ${files.length}`;
    $("#progBar").style.width=`${Math.round(i/files.length*100)}%`;
    try{
      const blob=await shrink(files[i]);
      const ext = blob.type==="image/jpeg" ? "jpg" : ((files[i].name.split(".").pop()||"jpg").toLowerCase());
      const path=`${day}/${Date.now()}-${Math.random().toString(36).slice(2,8)}.${ext}`;
      const up=await sb.storage.from(BUCKET).upload(path, blob, { contentType: blob.type||"image/jpeg", upsert:false });
      if(up.error) throw up.error;
      const ins=await sb.from(TABLE).insert({ path, day, uploader:who });
      if(ins.error) throw ins.error;
      ok++;
    }catch(err){ console.error(err); }
  }
  $("#progBar").style.width="100%";
  $("#progTxt").textContent = ok===files.length ? `✅ ${ok}장 올렸어요` : `${ok}장 성공 · ${files.length-ok}장 실패`;
  setTimeout(()=>$("#prog").classList.remove("on"),2000);
  $("#pick").disabled=false;
  filter=day; await load();
});

/* ── 크게 보기: 넘기기 + 핀치 확대 ── */
let cur=0, list=[], scale=1, tx=0, ty=0;
const img=$("#lbImg"), stage=$("#stage");
function applyT(){ img.style.transform=`translate(calc(-50% + ${tx}px), calc(-50% + ${ty}px)) scale(${scale})`; }
function resetT(){ scale=1; tx=0; ty=0; applyT(); }
function show(){
  const p=list[cur]; if(!p) return;
  img.src=p.url; resetT();
  const d=DAYS.find(x=>x.date===p.day);
  $("#lbInfo").textContent=`${d?d.label:""} · ${p.uploader||""} · ${cur+1} / ${list.length}`;
  $("#lbSave").href=p.url;
  $("#prev").hidden=$("#next").hidden=list.length<2;
}
function openLb(id){ list=view(); cur=Math.max(0,list.findIndex(p=>String(p.id)===String(id))); show(); $("#lb").classList.add("on"); document.body.style.overflow="hidden";
  try{ history.pushState({lb:1},""); }catch(e){} }
function closeLb(fromPop){ if(!$("#lb").classList.contains("on")) return; $("#lb").classList.remove("on"); document.body.style.overflow="";
  if(!fromPop){ try{ if(history.state&&history.state.lb) history.back(); }catch(e){} } }
function move(d){ if(list.length<2) return; cur=(cur+d+list.length)%list.length; show(); }
$("#list").addEventListener("click",e=>{ const p=e.target.closest(".ph"); if(p) openLb(p.dataset.id); });
$("#lbX").addEventListener("click",()=>closeLb());
$("#prev").addEventListener("click",e=>{ e.stopPropagation(); move(-1); });
$("#next").addEventListener("click",e=>{ e.stopPropagation(); move(1); });
window.addEventListener("popstate",()=>closeLb(true));
document.addEventListener("keydown",e=>{ if(!$("#lb").classList.contains("on")) return; if(e.key==="Escape") closeLb(); if(e.key==="ArrowLeft") move(-1); if(e.key==="ArrowRight") move(1); });

const pts=new Map(); let startDist=0, startScale=1, last=null, swipeX=null, lastTap=0;
stage.addEventListener("pointerdown",e=>{
  if(e.target.closest(".nav")) return;
  stage.setPointerCapture(e.pointerId); pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; startDist=Math.hypot(a.x-b.x,a.y-b.y); startScale=scale; swipeX=null; }
  else { last={x:e.clientX,y:e.clientY}; swipeX=e.clientX;
    const now=Date.now(); if(now-lastTap<300){ if(scale>1) resetT(); else { scale=2.5; applyT(); } swipeX=null; } lastTap=now; }
});
stage.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return; pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2){ const [a,b]=[...pts.values()]; const d=Math.hypot(a.x-b.x,a.y-b.y); scale=Math.min(5,Math.max(1,startScale*d/startDist)); if(scale===1){tx=0;ty=0;} applyT(); }
  else if(pts.size===1 && scale>1 && last){ tx+=e.clientX-last.x; ty+=e.clientY-last.y; last={x:e.clientX,y:e.clientY}; applyT(); }
});
function endPt(e){
  if(!pts.has(e.pointerId)) return; pts.delete(e.pointerId);
  if(pts.size===0){
    if(scale===1 && swipeX!==null){ const dx=e.clientX-swipeX; if(Math.abs(dx)>60) move(dx<0?1:-1); }
    swipeX=null; last=null;
  } else { const p=[...pts.values()][0]; last={x:p.x,y:p.y}; }
}
stage.addEventListener("pointerup",endPt); stage.addEventListener("pointercancel",endPt);

$("#lbDel").addEventListener("click", async ()=>{
  const p=list[cur]; if(!p||!sb) return;
  if(!confirm("이 사진을 삭제할까요?\n가족 모두의 앨범에서 지워져요.")) return;
  try{
    const r1=await sb.from(TABLE).delete().eq("id",p.id); if(r1.error) throw r1.error;
    await sb.storage.from(BUCKET).remove([p.path]);
    toast("삭제했어요"); closeLb(); await load();
  }catch(e){ console.error(e); toast("삭제 실패"); }
});

$("#chips").addEventListener("click",e=>{ const b=e.target.closest(".chip"); if(!b) return; filter=b.dataset.d; render(); });
$("#sync").addEventListener("click",()=>load(true));
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && sb && !$("#lb").classList.contains("on")) load(); });

setup(); load();
</script>
</body>
</html>
